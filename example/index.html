<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartForge Mock Template</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <style>
    [data-drop] { display:none; position:absolute; z-index:50; }
    [data-drop].open { display:block; }
    .modal-bg { display:none; }
    .modal-bg.open { display:flex; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white">

<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-64 shrink-0 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col">
    <div class="p-6">
      <h1 class="text-xl font-bold">SmartForge</h1>
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Mock template (lightweight)</p>
    </div>
    <nav class="flex-1 px-4" id="sidebar-nav"></nav>
    <div class="p-4 border-t border-gray-200 dark:border-gray-700 text-xs text-gray-500 dark:text-gray-400">
      Tip: keep this file small to speed up AI generation.
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="shrink-0 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-6 py-4">
      <div class="flex items-center justify-end space-x-3">

        <!-- Theme toggle -->
        <button id="btn-theme" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300" aria-label="Toggle theme">
          <i id="icon-theme" data-lucide="moon" class="w-4 h-4"></i>
        </button>

        <!-- Notifications -->
        <div class="relative">
          <button id="btn-notif" class="relative p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300" aria-label="Notifications">
            <i data-lucide="bell" class="w-4 h-4"></i>
            <span id="notif-dot" class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>
          <div id="drop-notif" data-drop class="right-0 top-11 w-80 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg p-4">
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-semibold">Notifications</h3>
              <button id="btn-notif-read" class="text-sm text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">Mark all as read</button>
            </div>
            <hr class="border-gray-200 dark:border-gray-700 mb-3">
            <div id="notif-list" class="space-y-3 max-h-72 overflow-y-auto"></div>
          </div>
        </div>

        <!-- User -->
        <div class="relative">
          <button id="btn-user" aria-label="User menu">
            <img id="hdr-avatar" src="" alt="" class="w-8 h-8 rounded-full object-cover cursor-pointer">
          </button>
          <div id="drop-user" data-drop class="right-0 top-11 w-64 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg p-4">
            <div class="flex items-center space-x-3 mb-3">
              <img id="drop-avatar" src="" alt="" class="w-12 h-12 rounded-full object-cover">
              <div>
                <p id="drop-name" class="font-semibold"></p>
                <p id="drop-email" class="text-sm text-gray-500 dark:text-gray-400"></p>
              </div>
            </div>
            <hr class="border-gray-200 dark:border-gray-700 mb-3">
            <div class="space-y-1">
              <button class="w-full flex items-center px-3 py-2 text-sm rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300"><i data-lucide="user" class="w-4 h-4 mr-2"></i>Profile</button>
              <button class="w-full flex items-center px-3 py-2 text-sm rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300"><i data-lucide="settings" class="w-4 h-4 mr-2"></i>Settings</button>
              <button class="w-full flex items-center px-3 py-2 text-sm rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300"><i data-lucide="help-circle" class="w-4 h-4 mr-2"></i>Help</button>
            </div>
            <hr class="border-gray-200 dark:border-gray-700 my-3">
            <button class="w-full flex items-center px-3 py-2 text-sm rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 text-red-600 dark:text-red-400"><i data-lucide="log-out" class="w-4 h-4 mr-2"></i>Sign out</button>
          </div>
        </div>

      </div>
    </header>

    <!-- Page content -->
    <main class="flex-1 overflow-auto bg-gray-50 dark:bg-gray-900" id="main"></main>

  </div>
</div>

<!-- Modal -->
<div id="modal-bg" class="modal-bg fixed inset-0 bg-black/50 z-50 items-center justify-center">
  <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-6 w-full max-w-md mx-4">
    <div class="flex items-center justify-between mb-4">
      <h3 id="modal-title" class="text-lg font-semibold"></h3>
      <button onclick="closeModal()" class="p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700" aria-label="Close modal">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// Lightweight mock: 3 simple screens + dropdowns + dark mode + modal

const DATA = {
  currentUser: {
    name: 'Lucy Pearl',
    email: 'lucy.pearl@company.com',
    avatar: 'https://res.cloudinary.com/ds574fco0/image/upload/v1753690876/people/11_jjng4x.jpg'
  },
  notifications: [
    { title: 'New task assigned', message: "You're assigned to 'Landing page refresh'", time: '2m ago', unread: true },
    { title: 'Meeting reminder', message: 'Design review starts in 30 minutes', time: '28m ago', unread: true },
    { title: 'Task completed', message: "'Fix mobile padding' was marked as done", time: '1h ago', unread: false },
  ],
  tasks: [
    { name: 'Landing page refresh', status: 'In Progress', statusCls: 'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200' },
    { name: 'Fix mobile padding', status: 'Pending', statusCls: 'bg-pink-100 text-pink-800 dark:bg-pink-900 dark:text-pink-200' },
    { name: 'Update onboarding copy', status: 'Completed', statusCls: 'bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200' },
  ],
  people: [
    { name: 'Adam Reid', role: 'Developer', email: 'adam.reid@company.com', team: 'Development', avatar: 'https://res.cloudinary.com/ds574fco0/image/upload/v1753690877/people/1_ndgrxc.jpg' },
    { name: 'Lily Grace', role: 'Designer', email: 'lily.grace@company.com', team: 'Design', avatar: 'https://res.cloudinary.com/ds574fco0/image/upload/v1753690876/people/0_riwhwx.jpg' },
    { name: 'Owen Scott', role: 'QA', email: 'owen.scott@company.com', team: 'Quality Assurance', avatar: 'https://res.cloudinary.com/ds574fco0/image/upload/v1753690877/people/2_qz3dx8.jpg' },
  ]
};

const S = { page: 'overview', dark: false };

const NAV = [
  { id:'overview', label:'Overview', icon:'layout-dashboard' },
  { id:'tasks',    label:'Tasks',    icon:'check-square' },
  { id:'people',   label:'People',   icon:'users' },
];

function icons(){ lucide.createIcons(); }

function renderSidebar(){
  const el = document.getElementById('sidebar-nav');
  el.innerHTML = NAV.map(n => {
    const active = S.page === n.id;
    const cls = active
      ? 'bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-200'
      : 'text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700';
    return `<button data-nav="${n.id}" class="w-full flex items-center px-3 py-2 mb-1 text-sm font-medium rounded-lg transition-colors ${cls}">
      <i data-lucide="${n.icon}" class="w-4 h-4 mr-3"></i>${n.label}
    </button>`;
  }).join('');
  icons();
}

function renderHeader(){
  const u = DATA.currentUser;
  document.getElementById('hdr-avatar').src = u.avatar;
  document.getElementById('drop-avatar').src = u.avatar;
  document.getElementById('drop-name').textContent = u.name;
  document.getElementById('drop-email').textContent = u.email;
  renderNotifications();
}

function renderNotifications(){
  const list = document.getElementById('notif-list');
  list.innerHTML = DATA.notifications.map(n => `
    <div class="p-3 rounded-lg ${n.unread ? 'bg-blue-50 dark:bg-blue-900/20' : 'bg-gray-50 dark:bg-gray-700'}">
      <div class="flex items-start justify-between">
        <div class="flex-1">
          <p class="text-sm font-medium">${n.title}</p>
          <p class="text-sm text-gray-600 dark:text-gray-300 mt-1">${n.message}</p>
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">${n.time}</p>
        </div>
        ${n.unread ? '<div class="w-2 h-2 bg-blue-500 rounded-full mt-1 ml-2 shrink-0"></div>' : ''}
      </div>
    </div>`
  ).join('');

  const hasUnread = DATA.notifications.some(n => n.unread);
  document.getElementById('notif-dot').style.display = hasUnread ? 'block' : 'none';
  icons();
}

function go(page){
  S.page = page;
  closeDrops();
  renderSidebar();
  renderPage();
}

function renderPage(){
  const main = document.getElementById('main');
  if (S.page === 'overview') main.innerHTML = overviewHTML();
  if (S.page === 'tasks') main.innerHTML = tasksHTML();
  if (S.page === 'people') main.innerHTML = peopleHTML();
  icons();
}

function cardShell(title, subtitle, body){
  return `<div class="p-6">
    <div class="max-w-5xl mx-auto">
      <div class="mb-6">
        <h1 class="text-2xl font-bold">${title}</h1>
        ${subtitle ? `<p class="text-gray-600 dark:text-gray-400">${subtitle}</p>` : ''}
      </div>
      ${body}
    </div>
  </div>`;
}

function overviewHTML(){
  return cardShell(
    'Overview',
    'Simple mock screens for AI-guided app generation.',
    `<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-5">
        <div class="flex items-center justify-between">
          <p class="text-sm text-gray-500 dark:text-gray-400">Open tasks</p>
          <i data-lucide="check-square" class="w-4 h-4 text-gray-400"></i>
        </div>
        <p class="text-2xl font-bold mt-2">${DATA.tasks.filter(t=>t.status!=='Completed').length}</p>
      </div>
      <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-5">
        <div class="flex items-center justify-between">
          <p class="text-sm text-gray-500 dark:text-gray-400">Team members</p>
          <i data-lucide="users" class="w-4 h-4 text-gray-400"></i>
        </div>
        <p class="text-2xl font-bold mt-2">${DATA.people.length}</p>
      </div>
      <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-5">
        <div class="flex items-center justify-between">
          <p class="text-sm text-gray-500 dark:text-gray-400">Unread notifications</p>
          <i data-lucide="bell" class="w-4 h-4 text-gray-400"></i>
        </div>
        <p class="text-2xl font-bold mt-2">${DATA.notifications.filter(n=>n.unread).length}</p>
      </div>
    </div>

    <div class="mt-6 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-6">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold flex items-center"><i data-lucide="sparkles" class="w-5 h-5 mr-2"></i>Quick actions</h2>
        <button class="text-sm text-gray-600 dark:text-gray-300 px-3 py-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-700" onclick="openAbout()">About</button>
      </div>
      <p class="text-sm text-gray-600 dark:text-gray-300 mt-3">Use this template as a design reference. Keep logic minimal.</p>
    </div>`
  );
}

function tasksHTML(){
  const rows = DATA.tasks.map(t => `
    <div class="flex items-center justify-between py-3 border-b border-gray-100 dark:border-gray-700 last:border-0">
      <div class="min-w-0">
        <p class="text-sm font-medium truncate">${t.name}</p>
        <p class="text-xs text-gray-500 dark:text-gray-400">Mock item • no backend</p>
      </div>
      <span class="px-2 py-1 rounded-full text-xs font-medium ${t.statusCls}">${t.status}</span>
    </div>`
  ).join('');

  return cardShell(
    'Tasks',
    'A tiny list with statuses (mock).',
    `<div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold flex items-center"><i data-lucide="list-checks" class="w-5 h-5 mr-2"></i>My tasks</h2>
        <button class="flex items-center px-3 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700" onclick="openCreateTask()">
          <i data-lucide="plus" class="w-4 h-4 mr-2"></i>New task
        </button>
      </div>
      ${rows}
    </div>`
  );
}

function peopleHTML(){
  const cards = DATA.people.map(p => `
    <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-5">
      <div class="flex items-start space-x-3">
        <img src="${p.avatar}" class="w-10 h-10 rounded-full object-cover" alt="${p.name}">
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <p class="font-semibold text-sm truncate">${p.name}</p>
            <span class="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200">${p.team}</span>
          </div>
          <p class="text-xs text-gray-500 dark:text-gray-400">${p.role}</p>
          <p class="text-xs text-gray-500 dark:text-gray-400 truncate">${p.email}</p>
        </div>
      </div>
    </div>`
  ).join('');

  return cardShell(
    'People',
    'Simple team cards (mock).',
    `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      ${cards}
    </div>`
  );
}

function modal(title, bodyHtml){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-bg').classList.add('open');
  icons();
}
function closeModal(){ document.getElementById('modal-bg').classList.remove('open'); }

function openAbout(){
  modal('About this template', `
    <div class="space-y-3 text-sm text-gray-700 dark:text-gray-300">
      <p><b>Goal:</b> Provide a lightweight, readable design reference for AI agents.</p>
      <ul class="list-disc pl-5 space-y-1">
        <li>3 pages (Overview, Tasks, People)</li>
        <li>Dark mode + dropdowns + modal</li>
        <li>Minimal data and minimal rendering logic</li>
      </ul>
      <div class="flex justify-end">
        <button onclick="closeModal()" class="px-4 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">Close</button>
      </div>
    </div>`
  );
}

function openCreateTask(){
  modal('Create task (mock)', `
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Title</label>
        <input type="text" placeholder="e.g. Prepare release notes" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <p class="text-xs text-gray-500 dark:text-gray-400">This is only a UI mock. No persistence.</p>
      <div class="flex justify-end space-x-2">
        <button onclick="closeModal()" class="px-4 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">Cancel</button>
        <button onclick="closeModal()" class="px-4 py-2 text-sm bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-lg hover:bg-gray-700 dark:hover:bg-gray-100">Create</button>
      </div>
    </div>`
  );
}

function toggleDrop(e, id){
  if (e && e.stopPropagation) e.stopPropagation();
  const el = document.getElementById(id);
  const wasOpen = el.classList.contains('open');
  closeDrops();
  if (!wasOpen) el.classList.add('open');
}
function closeDrops(){ document.querySelectorAll('[data-drop]').forEach(el => el.classList.remove('open')); }

function toggleTheme(){
  S.dark = !S.dark;
  document.documentElement.classList.toggle('dark', S.dark);
  document.getElementById('icon-theme').setAttribute('data-lucide', S.dark ? 'sun' : 'moon');
  icons();
}

document.addEventListener('DOMContentLoaded', () => {
  renderSidebar();
  renderHeader();
  renderPage();

  document.getElementById('btn-theme').addEventListener('click', toggleTheme);
  document.getElementById('btn-notif').addEventListener('click', e => toggleDrop(e,'drop-notif'));
  document.getElementById('btn-user').addEventListener('click', e => toggleDrop(e,'drop-user'));
  document.getElementById('btn-notif-read').addEventListener('click', e => {
    e.stopPropagation();
    DATA.notifications = DATA.notifications.map(n => ({...n, unread:false}));
    renderNotifications();
  });

  document.getElementById('modal-bg').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
  document.addEventListener('click', closeDrops);

  document.getElementById('sidebar-nav').addEventListener('click', e => {
    const btn = e.target.closest('[data-nav]');
    if (!btn) return;
    go(btn.getAttribute('data-nav'));
  });
});
</script>
</body>
</html>
